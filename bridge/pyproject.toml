[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrlrun-openclaw"
version = "0.1.0"
description = "CTRLRun's execution safety layer for OpenClaw, as a before_tool_call gate."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["openclaw", "ctrlrun", "agent-guardrails", "tool-authorization", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# The kernel range this adapter is written against. It uses only the public adapter surface
# SPEC-v0.5 §2 freezes, plus `Control`'s public properties.
dependencies = ["ctrlrun>=0.12,<0.13"]

[project.urls]
Homepage = "https://github.com/CTRLRun/openclaw-ctrlrun"
Documentation = "https://docs.ctrlrun.dev/"

[project.scripts]
ctrlrun-openclaw-bridge = "ctrlrun_openclaw.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=2.3", "ruff>=0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctrlrun_openclaw"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
force-exclude = true

# The kernel's selection, so an adapter reads the way the kernel reads. ANN is left out: this
# package is a process boundary whose handlers are dispatched by `http.server` with signatures
# it does not own.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `BaseHTTPRequestHandler` names the methods; they are not this file's to rename, and `fmt`
# shadowing a builtin is that base class's signature too.
"src/ctrlrun_openclaw/bridge.py" = ["N802", "A002"]
# Same reason the kernel exempts its own `errors.py`: this refusal sits beside `NotExecuted`,
# `DuplicateEffect` and `AmbiguousEffect` in an operator's `except` clause, and
# `OutcomeNotReportedError` next to those would be the odd one out.
"src/ctrlrun_openclaw/call.py" = ["N818"]
