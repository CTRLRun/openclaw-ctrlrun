#
# Publishing without a long-lived token.
#
# PyPI Trusted Publishing mints a short-lived credential from this workflow's OIDC identity,
# so nothing here holds a secret and there is no token to leak, rotate or scope wrongly. That
# matters here for a concrete reason: the first two publish attempts for this package failed
# on tokens, one revoked and one scoped to a different project, and neither failure was
# visible until the upload was refused.
#
# One manual step, once, before the first tag: on PyPI, add a *pending publisher* under
# Account -> Publishing. A pending publisher can be created for a project that does not exist
# yet, which is exactly this case.
#
#   PyPI project name:  ctrlrun-openclaw
#   Owner:              CTRLRun
#   Repository:         openclaw-ctrlrun
#   Workflow:           publish.yml
#   Environment:        pypi
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: bridge to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The whole point: this, not a stored token, is the credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: bridge
        run: python -m pip install --upgrade pip build && python -m build --outdir dist .

      # The tag must name the version the package actually declares, or the release is one
      # nobody asked for. Checked before anything is uploaded, because an upload cannot be
      # taken back: a version on PyPI can never be reused.
      - name: The tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: bridge
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HAVE=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG declared=$HAVE"
          test "$TAG" = "$HAVE"

      - name: The wheel installs clean and pulls the kernel
        working-directory: bridge
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/ctrlrun-openclaw-bridge --help > /dev/null

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bridge/dist
