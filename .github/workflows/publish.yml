#
# Publishing without a long-lived token.
#
# Trusted publishing mints a short-lived credential from this workflow's OIDC identity, so
# nothing here holds a secret and there is no token to leak, rotate or scope wrongly. That
# matters here for a concrete reason: the first two PyPI attempts for this package failed on
# tokens, one revoked and one scoped to a different project, and neither failure was visible
# until the upload was refused.
#
# It is also where npm is going. GitHub deprecated 2FA-bypass granular access tokens on
# 2026-07-08: from early August 2026 they no longer skip 2FA for sensitive operations, and
# around January 2027 they lose the ability to publish at all. Trusted publishing and staged
# publishing with a human approval are the two routes that survive that.
#
#   https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/
#
# ── One-time setup, and the asymmetry between the two registries ──────────────────────────
#
# PyPI accepts a *pending publisher* for a project that does not exist yet, so it needed no
# bootstrap. Already configured:
#
#   project ctrlrun-openclaw / CTRLRun / openclaw-ctrlrun / publish.yml / environment pypi
#
# npm cannot do that. A trusted publisher is configured on the package's settings page, which
# only exists once the package does, so **the first npm publish must be interactive**:
#
#   cd plugin && npm publish --access public --otp=<six digits>
#
# After that one publish, on npmjs.com go to the package settings, "Trusted Publisher",
# GitHub Actions, and enter:
#
#   repository CTRLRun/openclaw-ctrlrun / workflow publish.yml / environment npm
#
# From the next tag on, the npm job below publishes with no token at all.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: bridge to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The whole point: this, not a stored token, is the credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: bridge
        run: python -m pip install --upgrade pip build && python -m build --outdir dist .

      # The tag must name the version the package actually declares, or the release is one
      # nobody asked for. Checked before anything is uploaded, because an upload cannot be
      # taken back: a version on PyPI can never be reused.
      - name: The tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: bridge
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HAVE=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG declared=$HAVE"
          test "$TAG" = "$HAVE"

      - name: The wheel installs clean and pulls the kernel
        working-directory: bridge
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/ctrlrun-openclaw-bridge --help > /dev/null

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bridge/dist
          # A version that is already up is not a failure; a re-run after a half-failed
          # release should be able to finish the other half.
          skip-existing: true

  npm:
    name: plugin to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0. Node 24 ships npm 11.x.
      # Deliberately no `registry-url`. It writes an .npmrc line expecting NODE_AUTH_TOKEN,
      # and an empty token is still a credential: npm sends it and never reaches the OIDC
      # exchange. The failure is a 404 on the PUT, which reads like a missing package rather
      # than a rejected identity.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm is new enough to publish over OIDC
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          test -z "${NODE_AUTH_TOKEN:-}" || (echo "a token is set; OIDC would be bypassed" && exit 1)
          node -e "const [a,b,c]=process.versions.node.split('.').map(Number);if(a<22||(a===22&&b<14))throw new Error('node too old for trusted publishing')"

      - name: The tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HAVE=$(node -p "require('./package.json').version")
          echo "tag=$TAG declared=$HAVE"
          test "$TAG" = "$HAVE"

      - name: Build and test
        working-directory: plugin
        run: |
          npx --yes esbuild@0.25.0 index.ts bridge-client.ts decision.ts decision.test.ts \
            --format=esm --platform=node --target=node24 --outdir=dist
          node --test dist/decision.test.js

      # The host refuses a TypeScript entry for a packaged install, so a tarball without
      # dist/index.js is one nobody can install. Checked before the upload, not after.
      - name: The tarball carries the compiled entry the host requires
        working-directory: plugin
        run: |
          npm pack --pack-destination /tmp
          tar tzf /tmp/ctrlrun-openclaw-*.tgz | tee /tmp/files
          grep -q 'package/dist/index.js' /tmp/files
          grep -q 'package/openclaw.plugin.json' /tmp/files

      # No NODE_AUTH_TOKEN. The OIDC identity above is the credential.
      - name: Publish
        working-directory: plugin
        run: npm publish --provenance --access public
